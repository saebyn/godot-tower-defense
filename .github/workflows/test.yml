name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: "recursive"

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y blender

      - name: Setup Godot
        run: |
          mkdir -v -p /github/home/.config/godot
          # Configure Blender path in editor settings with proper Godot format
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "/usr/bin/blender"\n' > /github/home/.config/godot/editor_settings-4.tres

      - name: Cache Godot import files
        id: cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ hashFiles('.godot/imported/*') }}
  
      - name: Import project files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Running initial project import (this may take 15+ minutes)..."
          godot --headless --import --path . --quit

      - name: Run Tests
        run: |
          ./run_tests.sh
          EXIT_CODE=$?
          echo "Test exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Tests failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "All tests passed"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .godot/
          retention-days: 7
