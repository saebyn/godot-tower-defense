name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: "recursive"

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y blender
  
      - name: Cache Godot import files
        id: cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ hashFiles('.godot/imported/*') }}

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          mv Godot_v4.5-stable_linux.x86_64 ./godot
          ./godot --version

      - name: Setup Godot
        run: |
          mkdir -v -p /github/home/.config/godot
          # Configure Blender path in editor settings with proper Godot format
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "/usr/bin/blender"\n' > /github/home/.config/godot/editor_settings-4.tres

      - name: Import project files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Running initial project import (this may take 15+ minutes)..."
          ./godot --headless --import --path . --quit || echo "Import completed or timed out"

      - name: Run Tests
        run: |
          ./run_tests.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .godot/
          retention-days: 7
