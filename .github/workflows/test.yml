name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    container:
      image: ghcr.io/saebyn/zom-nom-defense/godot-ci:latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: "recursive"

      - name: Cache Godot import files
        id: cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-v1-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.blend', '**/*.gd', 'project.godot') }}
          restore-keys: |
            godot-import-v1-

      - name: Pre-configure Godot Editor Settings
        run: |
          # Pre-configure Godot editor settings for Blender path
          mkdir -p /github/home/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "/usr/bin/blender"\n' > /github/home/.config/godot/editor_settings-4.tres

      - name: Import project files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Running initial project import (this may take 15+ minutes)..."
          godot --headless --import --path . --quit

      - name: Check for uncommitted scene/resource changes after import
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git diff --exit-code -- '*.tscn' '*.tres' || (
            echo "Godot normalised scene/resource files during import."
            echo "Re-open and re-save these files in the editor, then commit the result:"
            git diff --name-only -- '*.tscn' '*.tres'
            exit 1
          )

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: ./run_tests.sh

      - name: Annotate PR with test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results.xml
          fail_on_failure: true
          check_name: Unit Tests
          include_passed: true

      - name: Fail if tests failed without report
        if: always() && steps.run_tests.outcome == 'failure' && hashFiles('test-results.xml') == ''
        run: exit 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7
