<svg width="16" height="16" viewBox="0 0 16 16"
  xmlns="http://www.w3.org/2000/svg">
  <!-- Tech Tree Icon - Simple node graph representation, white on transparent -->
  <!-- Connections -->
  <line x1="8" y1="5" x2="4" y2="8" stroke="white" stroke-width="1"/>
  <line x1="8" y1="5" x2="12" y2="8" stroke="white" stroke-width="1"/>
  <!-- Nodes -->
  <circle cx="8" cy="3" r="2" fill="white"/>
  <circle cx="4" cy="10" r="2" fill="white"/>
  <circle cx="12" cy="10" r="2" fill="white"/>
</svg>
